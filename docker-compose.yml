# One-command run:  docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: samanvay, POSTGRES_PASSWORD: samanvay, POSTGRES_DB: samanvay }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "samanvay"], interval: 3s, retries: 20 }
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://samanvay:samanvay@db:5432/samanvay
      PUBLIC_WEB_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
    depends_on: { db: { condition: service_healthy } }
    volumes: [uploads:/app/uploads]
    ports: ["8010:8000"]
  web:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes: { dbdata: {}, uploads: {} }
