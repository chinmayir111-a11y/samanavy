# Render blueprint: backend web service + free Postgres. Set the SMTP keys and
# TEST_ALERT_EMAIL in the Render dashboard (never in this file).
databases:
  - name: samanvay-db
    plan: free
    databaseName: samanvay
    user: samanvay
services:
  - type: web
    name: samanvay-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: samanvay-db, property: connectionString }
      - { key: JWT_SECRET, generateValue: true }
      - { key: DEMO_MODE, value: "true" }
      - { key: APP_ENV, value: "production" }
      - { key: COOKIE_SECURE, value: "true" }
      - { key: PUBLIC_WEB_URL, sync: false }
      - { key: CORS_ORIGINS, sync: false }
      # Render's free tier blocks SMTP: set BREVO_API_KEY (free Brevo account, sender verified) and SMTP_FROM.
      - { key: BREVO_API_KEY, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: SMTP_FROM, sync: false }
      - { key: TEST_ALERT_EMAIL, sync: false }
